<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="apple-touch-icon" sizes="180x180" href="../assets/pictures/icons/nk-apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/pictures/icons/nk-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/pictures/icons/nk-16x16.png">
    <title>ตารางเรียนออนไลน์ 4.3</title>
    <link rel="stylesheet" href="../assets/css/verify.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script type="module" src="../assets/js/verify.js" defer></script>

<body>
    <header>
        <div class="header">
            <a href="../" class="home">ตารางเรียนออนไลน์ 4.3</a>
            <nav>
                <a href="" id="logOutNav">ออกจากระบบ</a>
                <a href="./" id="verifyNav">ยืนยันสถานะ</a>
                <a href="./" id="userNav">บัญชีผู้ใช้</a>
                <img src="../assets/pictures/cross.webp" id="statusNav" alt="สถานะ" title="ยังไม่ได้ยืนยันสถานะครู">
            </nav>
        </div>
        <div class="header-line"></div>
    </header>
    <main>
        <form>
            <div>
                <h1>กรอกรหัสยืนยันตัวตนครู</h1>
                <input type="password" id="verifyPassword" placeholder="กรอกรหัสยืนยันตัวตนครู">
                <p class="errorMessage" id="errorVerifyPassword">*กรุณากรอกรหัสผ่าน</p>
            </div>
            <div id="outSubmit">
                <button type="submit" class="submit" id="submit">ยืนยัน</button>
            </div>
        </form>
    </main>
</body>
