<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wdth,wght@62.5..100,100..900&family=Sarabun:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <title>ตารางเรียนออนไลน์ 4.3</title>
    <link rel="stylesheet" href="../assets/css/signup.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script type="module" src="../assets/js/signup.js" defer></script>
</head>
<body>
    <header>
        <div class="header">
            <a href="../" class="home">ตารางเรียนออนไลน์ 4.3</a>
            <nav>
                <a href="./">ลงชื่อเข้าใช้</a>
                <a href="../login/">เข้าสู่ระบบ</a>
            </nav>
        </div>
        <div class="header-line"></div>
    </header>
    <main>
        <form id="signUp" novalidate>
            <h1>ลงชื่อเข้าใช้</h1>
            <div>
                <div>
                    <label>ชื่อบัญชี</label>
                    <input type="text" id="username" name="username" placeholder="กรอกชื่อบัญชี">
                    <p class="errorMessage" id="errorUsername">*กรุณากรอกชื่อบัญชี</p>
                </div>
                <div>
                    <label>อีเมล</label>
                    <input type="email" id="email" name="email" placeholder="กรอกอีเมล">
                    <p class="errorMessage" id="errorEmail">*กรุณากรอกอีเมล</p>
                </div>
                <div>
                    <label>รหัสผ่าน</label>
                    <input type="password" id="password" name="password" placeholder="กรอกรหัสผ่าน">
                    <p class="errorMessage" id="errorPassword">*กรุณากรอกรหัสผ่าน</p>
                </div>
                <div>
                    <label>ยืนยันรหัสผ่าน</label>
                    <input type="password" id="passwordAgain" name="passwordAgain" placeholder="กรอกรหัสผ่านอีกครั้ง">
                    <p class="errorMessage" id="errorPasswordAgain">*กรุณากรอกรหัสผ่านอีกครั้ง</p>
                </div>
            </div>
            <div id="outSubmit">
                <button type="submit" class="submit" id="submit">ลงชื่อเข้าใช้</button>
            </div>
        </form>
        <div id="verifyPage">
            <h1>ยืนยันตัวตนผ่านลิงก์ในอีเมล</h1>
        </div>
        </form>
    </main>
</body>
</html>
